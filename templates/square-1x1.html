<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="gve-format" content="square">
<title>GVE — Square 1:1 template</title>
<link rel="stylesheet" href="../brand/brand.css">
<style>
  .canvas { --w:1080px; --h:1080px; }
  .headline { font-size: 120px; }
</style>
</head>
<body>
<div class="canvas crimson">
  <div class="blob" style="width:600px;height:600px;right:-220px;bottom:-200px"></div>

  <div class="content">
    <div class="topbar">
      <div class="wordmark">GLOBAL VISA EXPERTS<small>STUDY · WORK · SETTLE</small></div>
    </div>

    <div style="margin-top:70px">
      <div class="script">Planning to</div>
      <div class="headline">STUDY <span class="accent">UK</span></div>
    </div>

    <div class="pill" style="margin-top:30px">Take the first step today</div>

    <ul class="benefits" style="margin-top:44px">
      <li>Expert visa guidance</li>
      <li>IELTS preparation help</li>
      <li>Free consultation</li>
    </ul>

    <div class="spacer"></div>
    <div class="contact">
      <span>📞 PHONE</span><span>🌐 WEBSITE</span><span>✉ EMAIL</span>
    </div>
  </div>
</div>
</body>
</html>
