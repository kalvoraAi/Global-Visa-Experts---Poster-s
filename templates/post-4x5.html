<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="gve-format" content="post">
<title>GVE — Post 4:5 template</title>
<link rel="stylesheet" href="../brand/brand.css">
<style>
  .canvas { --w:1080px; --h:1350px; }
  .plane { position:absolute; right:70px; top:250px; width:300px; opacity:.9; }
</style>
</head>
<body>
<div class="canvas royal">
  <div class="blob" style="width:700px;height:700px;right:-250px;top:-200px"></div>
  <div class="blob" style="width:500px;height:500px;left:-200px;bottom:-150px"></div>

  <!-- Plane with dashed flight path -->
  <svg class="plane" viewBox="0 0 300 200" fill="none">
    <path d="M10 180 C 90 60, 180 160, 260 40" stroke="#fff" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M255 30 l30 -10 -12 28 -6 -10z" fill="#FFC727"/>
  </svg>

  <div class="content">
    <div class="topbar">
      <!-- Replace with <img class="logo" src="../brand/logo/gve-logo.png"> once the logo is added -->
      <div class="wordmark">GLOBAL VISA EXPERTS<small>STUDY · WORK · SETTLE</small></div>
    </div>

    <div style="margin-top:110px">
      <div class="script">Study in</div>
      <div class="headline accent">CANADA</div>
    </div>

    <div class="pill" style="margin-top:36px">Intake 2027 — Apply now</div>

    <ul class="benefits" style="margin-top:56px">
      <li>Top colleges &amp; universities</li>
      <li>Expert visa file guidance</li>
      <li>Scholarship support</li>
      <li>Free profile assessment</li>
    </ul>

    <div class="spacer"></div>
    <div class="cta">Book a free consultation →</div>

    <!-- Contact strip: fill in real details from brand/BRAND.md only -->
    <div class="contact" style="margin-top:36px">
      <span>📞 PHONE</span><span>🌐 WEBSITE</span><span>✉ EMAIL</span>
    </div>
  </div>
</div>
</body>
</html>
