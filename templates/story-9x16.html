<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="gve-format" content="story">
<title>GVE — Story 9:16 template</title>
<link rel="stylesheet" href="../brand/brand.css">
<style>
  /* Instagram covers the top ~250px and bottom ~340px of a story: keep text out of those zones */
  .canvas { --w:1080px; --h:1920px; --safe-top:250px; --safe-bottom:340px; }
  .globe { width:300px; height:300px; align-self:center; margin-top:40px; }
</style>
</head>
<body>
<div class="canvas teal">
  <div class="blob" style="width:900px;height:900px;left:-300px;top:-300px"></div>
  <div class="blob" style="width:700px;height:700px;right:-260px;bottom:-200px"></div>

  <div class="content">
    <div class="topbar">
      <img class="logo" src="../brand/logo/gve-logo-white.png" alt="Global Visa Experts">
    </div>

    <div style="margin-top:50px">
      <div class="script">Your future in</div>
      <div class="headline accent">AUSTRALIA</div>
    </div>

    <!-- Simple CSS/SVG globe — swap for a real photo in assets/ -->
    <svg class="globe" viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="3">
      <circle cx="100" cy="100" r="90"/>
      <ellipse cx="100" cy="100" rx="40" ry="90"/>
      <path d="M10 100h180M25 55h150M25 145h150"/>
    </svg>

    <div class="pill" style="margin-top:40px">Intake 2027 open</div>

    <ul class="benefits" style="margin-top:36px">
      <li>Top universities</li>
      <li>Expert visa guidance</li>
      <li>Free profile assessment</li>
    </ul>

    <div class="spacer"></div>
    <div class="cta" style="margin-top:40px">Apply Now →</div>

    <div class="contact" style="margin-top:30px">
      <div class="row phones"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>+91 93424 93425 &nbsp;|&nbsp; +91 95819 93949</div>
      <div class="row"><svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg><span><b>Vijayawada:</b> Above Reflections Store, MG Road</span></div>
      <div class="row"><svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg><span><b>Guntur:</b> Opp HDFC Bank, Lakshmipuram Main Road</span></div>
    </div>
  </div>
</div>
</body>
</html>
